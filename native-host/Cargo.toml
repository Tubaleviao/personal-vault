[package]
name = "personal-vault-native-host"
version = "0.1.0"
edition = "2021"
description = "Personal Vault native messaging host — vault file I/O bridge for the browser extension"

[[bin]]
name = "personal-vault-native-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
