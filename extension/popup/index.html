<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #f1f5f9;
      width: 320px;
      min-height: 200px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e293b;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #7dd3fc; flex: 1 }
    #status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #64748b;
    }
    #status-dot.unlocked { background: #22c55e }

    section { padding: 12px 16px }
    section h2 { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px }

    #unlock-form { display: flex; flex-direction: column; gap: 8px }
    #unlock-form input {
      background: #1e293b; border: 1px solid #334155; border-radius: 6px;
      color: #f1f5f9; font-size: 13px; padding: 8px 10px; outline: none;
      width: 100%;
    }
    #unlock-form input:focus { border-color: #3b82f6 }
    button {
      border: none; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 500; padding: 7px 12px;
    }
    .btn-primary { background: #3b82f6; color: #fff }
    .btn-primary:hover { background: #2563eb }
    .btn-danger { background: transparent; color: #f87171; border: 1px solid #f87171 }
    .btn-danger:hover { background: rgba(248,113,113,.1) }

    #error-msg { color: #f87171; font-size: 12px; display: none }

    .approval-list { list-style: none; display: flex; flex-direction: column; gap: 6px }
    .approval-item {
      background: #1e293b; border-radius: 6px; padding: 8px 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .approval-origin { font-size: 12px; color: #7dd3fc; word-break: break-all }
    .approval-types { font-size: 10px; color: #64748b; margin-top: 2px }
    .revoke-btn {
      margin-left: 10px; flex-shrink: 0;
      background: transparent; color: #94a3b8; border: none; cursor: pointer;
      font-size: 14px; line-height: 1; padding: 2px 4px;
    }
    .revoke-btn:hover { color: #f87171 }

    #no-approvals { color: #475569; font-size: 12px; text-align: center; padding: 12px 0 }
    #lock-btn { margin-top: 12px; width: 100% }

    #native-badge {
      font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 4px;
      background: #1e293b; color: #475569; white-space: nowrap;
    }
    #native-badge.connected { background: #14532d; color: #4ade80 }
  </style>
</head>
<body>
  <header>
    <div id="status-dot"></div>
    <h1>Personal Vault</h1>
    <span id="did-short" style="color:#475569;font-size:11px"></span>
    <span id="native-badge" title="Desktop app connection status">desktop</span>
  </header>

  <!-- Unlock form (shown when vault is locked) -->
  <section id="locked-view">
    <h2>Unlock Vault</h2>
    <form id="unlock-form" autocomplete="off">
      <input type="password" id="passphrase" placeholder="Passphrase" autofocus>
      <input type="password" id="mnemonic-input" placeholder="Recovery phrase (optional — needed for sync)">
      <div id="error-msg"></div>
      <button type="submit" class="btn-primary">Unlock</button>
    </form>
  </section>

  <!-- Unlocked view -->
  <section id="unlocked-view" style="display:none">
    <h2>Approved Sites</h2>
    <ul id="approval-list" class="approval-list"></ul>
    <div id="no-approvals">No sites approved yet.</div>

    <h2 style="margin-top:14px">Sync</h2>
    <div id="sync-section" style="display:flex;flex-direction:column;gap:6px">
      <input type="url" id="relay-url" placeholder="https://your-relay.workers.dev" style="background:#1e293b;border:1px solid #334155;border-radius:6px;color:#f1f5f9;font-size:12px;padding:7px 10px;width:100%;outline:none">
      <div style="display:flex;gap:6px">
        <button id="save-relay-btn" class="btn-primary" style="flex:1">Save URL</button>
        <button id="sync-btn" class="btn-primary" style="flex:1">Sync now</button>
      </div>
      <div id="sync-status" style="font-size:11px;color:#64748b;min-height:16px"></div>
    </div>

    <button id="lock-btn" class="btn-danger" style="margin-top:14px;width:100%">Lock vault</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
